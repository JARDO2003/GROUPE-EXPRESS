<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Groupe Express</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef2ee;--card:#fff;--tx:#14231b;--mu:#5d6d63;--bd:#d6ded8;--ac:#1b5e3f;--ac2:#f2b705;--ok:#2b8a3e;--er:#c92a2a;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1713;--card:#17221c;--tx:#e8f0ea;--mu:#93a69a;--bd:#2a3a31;--ac:#4fbf8a;--ac2:#f2b705;--on:#0f1713}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Outfit,system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:3px solid var(--ac2);background:var(--card)}
h1{margin:0;font-size:20px;font-weight:700}
h2{margin:0 0 10px;font-size:16px}
main{max-width:900px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}
nav button[aria-selected=true]{background:var(--ac);color:var(--on);border-color:var(--ac)}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stats div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.stats b{display:block;font-size:22px}
.mu{color:var(--mu);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.row>div:first-child{min-width:0;flex:1}
.row .acts{display:flex;align-items:center;gap:8px;flex:none}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
form.col{flex-direction:column;align-items:stretch}
.btn{border:0;background:var(--ac);color:var(--on);padding:9px 14px;border-radius:8px;font:inherit;font-weight:500;cursor:pointer}
.btn.alt{background:var(--ac2);color:#2b2100}
.btn.ghost{background:transparent;color:var(--er);border:1px solid var(--bd);padding:6px 10px}
.btn.sm{padding:6px 10px;font-size:13px}
.cat{margin:16px 0 4px;font-weight:700;color:var(--ac)}
.off{opacity:.5}
.prix{width:90px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd)}
.empty{color:var(--mu);padding:14px 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.show{opacity:1}#toast.err{background:var(--er);color:#fff}
@media(max-width:560px){.row{flex-direction:column;align-items:stretch}.row .acts{justify-content:flex-end}}
</style>
</head>
<body>
<header>
  <h1>Groupe Express : administration</h1>
  <button class="btn sm" onclick="charger(true)">Actualiser</button>
</header>
<main>
<nav role="tablist" id="tabs">
  <button role="tab" data-t="cmd" aria-selected="true">Commandes</button>
  <button role="tab" data-t="menu" aria-selected="false">Menu</button>
  <button role="tab" data-t="msg" aria-selected="false">Messages</button>
  <button role="tab" data-t="avis" aria-selected="false">Avis</button>
  <button role="tab" data-t="dem" aria-selected="false">Demandes</button>
</nav>

<section id="t-cmd" class="on">
  <div class="stats" id="stats"></div>
  <div class="card">
    <h2>Ajouter une commande</h2>
    <form onsubmit="return ajouterCommande(event)">
      <select id="c-plat" required></select>
      <input id="c-nom" placeholder="Nom et prénom" required>
      <input id="c-contact" placeholder="Téléphone" inputmode="tel" required>
      <button class="btn">Enregistrer</button>
    </form>
  </div>
  <div class="card"><h2>Commandes d'aujourd'hui</h2><div id="cmds"></div></div>
</section>

<section id="t-menu">
  <div class="card">
    <h2>Ajouter un plat</h2>
    <form onsubmit="return ajouterPlat(event)">
      <input id="p-cat" list="cats" placeholder="Catégorie" required>
      <datalist id="cats"></datalist>
      <input id="p-nom" placeholder="Nom du plat" required>
      <input id="p-prix" class="prix" type="number" min="0" placeholder="Prix F" required>
      <label class="mu"><input id="p-des" type="checkbox"> Prix « Dès »</label>
      <button class="btn">Ajouter</button>
    </form>
  </div>
  <div class="card"><h2>Plats</h2><div id="plats"></div></div>
</section>

<section id="t-msg">
  <div class="card">
    <h2>Écrire à un client</h2>
    <form class="col" onsubmit="return envoyer(event)">
      <input id="m-to" placeholder="Numéro (ex : 0102030405)" inputmode="tel" required>
      <textarea id="m-txt" placeholder="Votre message" maxlength="1000" required></textarea>
      <button class="btn">Envoyer le message</button>
    </form>
  </div>
  <div class="card">
    <h2>Message à tous les clients</h2>
    <form class="col" onsubmit="return diffuser(event)">
      <textarea id="d-txt" placeholder="Message envoyé à tous les clients qui ont déjà écrit au bot" maxlength="1000" required></textarea>
      <button class="btn alt">Envoyer à tous</button>
    </form>
  </div>
  <div class="card">
    <h2>Message de retrait</h2>
    <p class="mu">Prévient tous les clients en attente que leur repas est prêt.</p>
    <button class="btn" onclick="rappel()">Envoyer le message de retrait</button>
  </div>
</section>

<section id="t-avis"><div class="card"><h2>Avis des clients</h2><div id="avis"></div></div></section>
<section id="t-dem"><div class="card"><h2>Demandes à traiter</h2><div id="dem"></div></div></section>
</main>
<div id="toast" role="status"></div>

<script>
// Adresse de ton API (le fichier webhook.js). Change-la si ton chemin est différent.
const API = "/api/webhook?admin=1";

const STATUTS = {
  en_attente: "En attente",
  rappel_envoye: "Prêt, client prévenu",
  livree: "Livrée",
  annulee: "Annulée"
};

let D = { plats: [], commandes: [], avis: [], demandes: [] };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const prix = n => Number(n || 0).toLocaleString("fr-FR").replace(/\u202f/g, " ") + " F";
const quand = d => d ? new Date(d).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "Africa/Abidjan" }) : "";

function toast(m, err) {
  const t = $("#toast");
  t.textContent = m;
  t.className = "show" + (err ? " err" : "");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = "", 3200);
}

async function api(body) {
  const r = await fetch(API, { method: "POST", body: JSON.stringify(body) });
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (!r.ok || j.ok === false) throw new Error(j.message || "Erreur " + r.status);
  return j;
}

async function act(body, ok) {
  try {
    const j = await api(body);
    if (ok) toast(typeof ok === "function" ? ok(j) : ok);
    await charger();
    return j;
  } catch (e) {
    toast(e.message, true);
  }
}

async function charger(manuel) {
  try {
    D = await api({ action: "donnees" });
    render();
    if (manuel) toast("Données actualisées");
  } catch (e) {
    toast("Chargement impossible : " + e.message, true);
  }
}

function render() {
  const cmds = D.commandes || [], plats = D.plats || [];
  const valides = cmds.filter(c => c.statut !== "annulee");

  $("#stats").innerHTML =
    `<div><b>${cmds.length}</b><span class="mu">commandes</span></div>` +
    `<div><b>${cmds.filter(c => c.statut === "en_attente").length}</b><span class="mu">en attente</span></div>` +
    `<div><b>${cmds.filter(c => c.statut === "livree").length}</b><span class="mu">livrées</span></div>` +
    `<div><b>${prix(valides.reduce((s, c) => s + (Number(c.prix) || 0), 0))}</b><span class="mu">montant du jour</span></div>`;

  $("#cmds").innerHTML = cmds.length ? cmds.map(c => `
    <div class="row">
      <div><b>${esc(c.code)}</b> ${esc(c.plat)} <span class="mu">${prix(c.prix)}</span>
        <div class="mu">${esc(c.nom)}, ${esc(c.contact)}, ${quand(c.date)}${c.source === "admin" ? ", ajoutée ici" : ""}</div></div>
      <div class="acts"><select onchange="statut('${esc(c.code)}',this.value)">
        ${Object.entries(STATUTS).map(([k, v]) => `<option value="${k}"${c.statut === k ? " selected" : ""}>${v}</option>`).join("")}
      </select></div>
    </div>`).join("") : `<div class="empty">Aucune commande aujourd'hui.</div>`;

  const sel = $("#c-plat"), garde = sel.value;
  sel.innerHTML = `<option value="">Choisir un plat</option>` +
    plats.filter(p => p.actif !== false).map(p => `<option value="${esc(p.id)}">${esc(p.nom)} (${prix(p.prix)})</option>`).join("");
  sel.value = garde;

  $("#cats").innerHTML = [...new Set(plats.map(p => p.categorie))].map(c => `<option value="${esc(c)}">`).join("");

  let cat = null, h = "";
  plats.forEach(p => {
    if (p.categorie !== cat) { cat = p.categorie; h += `<div class="cat">${esc(cat)}</div>`; }
    h += `<div class="row${p.actif === false ? " off" : ""}">
      <div>${esc(p.nom)} ${p.des ? '<span class="tag">Dès</span>' : ""}</div>
      <div class="acts">
        <input class="prix" type="number" min="0" value="${Number(p.prix) || 0}" onchange="changerPrix('${esc(p.id)}',this.value)" aria-label="Prix">
        <label class="mu"><input type="checkbox" ${p.actif !== false ? "checked" : ""} onchange="actif('${esc(p.id)}',this.checked)"> Actif</label>
        <button class="btn sm" onclick="renommer('${esc(p.id)}')">Renommer</button>
        <button class="btn ghost sm" onclick="supprimer('${esc(p.id)}')">Supprimer</button>
      </div></div>`;
  });
  $("#plats").innerHTML = h || `<div class="empty">Aucun plat. Ajoutez le premier ci-dessus.</div>`;

  $("#avis").innerHTML = (D.avis || []).length ? D.avis.map(a => `
    <div class="row"><div>${esc(a.avis)}<div class="mu">${esc(a.nom || "Client")}, ${quand(a.date)}</div></div></div>`).join("")
    : `<div class="empty">Aucun avis pour le moment.</div>`;

  $("#dem").innerHTML = (D.demandes || []).length ? D.demandes.map(d => `
    <div class="row"><div><b>${esc(d.resume)}</b>
      <div class="mu">« ${esc(d.message)} »</div>
      <div class="mu">${esc(d.nom || "Client")}, ${esc(d.chatId)}, ${quand(d.date)}</div></div>
      <div class="acts"><button class="btn sm" onclick="repondre('${esc(d.chatId)}')">Répondre</button></div></div>`).join("")
    : `<div class="empty">Aucune demande en attente.</div>`;
}

// Commandes
function statut(code, s) { act({ action: "commande_statut", code, statut: s }, "Statut mis à jour"); }

async function ajouterCommande(e) {
  e.preventDefault();
  const j = await act({
    action: "commande_ajouter",
    platId: $("#c-plat").value,
    nom: $("#c-nom").value,
    contact: $("#c-contact").value
  }, r => "Commande enregistrée : " + r.code);
  if (j) { $("#c-nom").value = ""; $("#c-contact").value = ""; }
  return false;
}

// Menu
async function ajouterPlat(e) {
  e.preventDefault();
  const j = await act({
    action: "plat_ajouter",
    categorie: $("#p-cat").value,
    nom: $("#p-nom").value,
    prix: $("#p-prix").value,
    des: $("#p-des").checked
  }, "Plat ajouté");
  if (j) { $("#p-nom").value = ""; $("#p-prix").value = ""; $("#p-des").checked = false; }
  return false;
}
function changerPrix(id, v) { act({ action: "plat_modifier", id, prix: v }, "Prix mis à jour"); }
function actif(id, v) { act({ action: "plat_modifier", id, actif: v }, v ? "Plat remis au menu" : "Plat retiré du menu"); }
function renommer(id) {
  const p = D.plats.find(x => x.id === id);
  const n = prompt("Nouveau nom du plat :", p ? p.nom : "");
  if (n && n.trim()) act({ action: "plat_modifier", id, nom: n.trim() }, "Plat renommé");
}
function supprimer(id) {
  const p = D.plats.find(x => x.id === id);
  if (confirm("Supprimer définitivement « " + (p ? p.nom : "ce plat") + " » ?")) act({ action: "plat_supprimer", id }, "Plat supprimé");
}

// Messages
async function envoyer(e) {
  e.preventDefault();
  const j = await act({ action: "message", to: $("#m-to").value, text: $("#m-txt").value }, "Message envoyé");
  if (j) $("#m-txt").value = "";
  return false;
}
async function diffuser(e) {
  e.preventDefault();
  if (!confirm("Envoyer ce message à tous les clients ?")) return false;
  const j = await act({ action: "diffusion", text: $("#d-txt").value }, r => `Envoyé à ${r.envoyes} client(s) sur ${r.clients}`);
  if (j) $("#d-txt").value = "";
  return false;
}
function rappel() {
  if (confirm("Prévenir maintenant tous les clients en attente que leur repas est prêt ?"))
    act({ action: "rappel" }, r => `${r.envoyes} client(s) prévenu(s) sur ${r.clients}`);
}
function repondre(chatId) {
  $("#m-to").value = chatId;
  montrer("msg");
  $("#m-txt").focus();
}

// Onglets
function montrer(t) {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.t === t));
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === "t-" + t));
}
$("#tabs").addEventListener("click", e => { if (e.target.dataset.t) montrer(e.target.dataset.t); });

charger();
setInterval(() => {
  const a = document.activeElement;
  if (!a || !/INPUT|SELECT|TEXTAREA/.test(a.tagName)) charger();
}, 30000);
</script>
</body>
</html>
